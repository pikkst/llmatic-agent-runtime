name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release contract packages
        run: pnpm exec tsc -b packages/release-metadata packages/update-installer

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate and package VSIX
        run: pnpm run ci

      - name: Run release acceptance
        run: node scripts/release-acceptance.mjs "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Run VS Code clean-install acceptance
        timeout-minutes: 10
        run: xvfb-run -a pnpm run vscode:acceptance

      - name: Verify release files
        run: |
          test -f "artifacts/llmatic-agent-runtime-${GITHUB_REF_NAME#v}.vsix"
          test -f "artifacts/release-manifest.json"
          sha256sum "artifacts/llmatic-agent-runtime-${GITHUB_REF_NAME#v}.vsix"
          cat artifacts/release-manifest.json

      - name: Upload accepted release candidate
        uses: actions/upload-artifact@v4
        with:
          name: llmatic-agent-runtime-${{ github.ref_name }}-accepted
          path: |
            artifacts/llmatic-agent-runtime-${{ steps.release_meta.outputs.version }}.vsix
            artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME"             "artifacts/llmatic-agent-runtime-$VERSION.vsix"             "artifacts/release-manifest.json"             --repo "$GITHUB_REPOSITORY"             --verify-tag             --generate-notes             --title "LLMatic Agent Runtime $GITHUB_REF_NAME"

      - name: Marketplace handoff summary
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "### Visual Studio Marketplace handoff"
            echo ""
            echo "Marketplace publication is intentionally manual."
            echo "Upload the exact accepted asset from this GitHub Release:"
            echo ""
            echo "`llmatic-agent-runtime-$VERSION.vsix`"
          } >> "$GITHUB_STEP_SUMMARY"
