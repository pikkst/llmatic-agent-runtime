name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build release metadata package
        run: pnpm exec tsc -b packages/release-metadata

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "$GITHUB_REF_NAME"

      - name: Validate and package VSIX
        run: pnpm run ci

      - name: Create release manifest
        run: node scripts/create-release-manifest.mjs "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Verify release files
        run: |
          test -f "artifacts/llmatic-agent-runtime-${GITHUB_REF_NAME#v}.vsix"
          test -f "artifacts/release-manifest.json"
          sha256sum "artifacts/llmatic-agent-runtime-${GITHUB_REF_NAME#v}.vsix"
          cat artifacts/release-manifest.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             "artifacts/llmatic-agent-runtime-${GITHUB_REF_NAME#v}.vsix"             "artifacts/release-manifest.json"             --repo "$GITHUB_REPOSITORY"             --verify-tag             --generate-notes             --title "LLMatic Agent Runtime $GITHUB_REF_NAME"
