name: Temporary format PR62

on:
  push:
    paths:
      - ".github/workflows/format-pr62.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write packages/gateway-client/test/adaptive.test.ts packages/review-engine/test/review-contract.test.ts packages/review-engine/test/review.test.ts
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/gateway-client/test/adaptive.test.ts packages/review-engine/test/review-contract.test.ts packages/review-engine/test/review.test.ts
          git commit -m "style: format PR62 tests"
          git push origin "HEAD:${GITHUB_REF_NAME}"
