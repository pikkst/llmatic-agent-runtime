name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Show canonical M13 formatting
        run: pnpm exec prettier apps/vscode-extension/src/extension.ts apps/vscode-extension/tsconfig.json packages/agent-orchestrator/src/orchestrator.ts packages/agent-orchestrator/test/orchestrator.test.ts packages/gateway-client/src/client.ts packages/workspace-files/src/files.ts packages/workspace-files/test/files.test.ts

      - name: Validate
        run: pnpm run ci

      - name: Upload VSIX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llmatic-agent-runtime-vsix
          path: artifacts/llmatic-agent-runtime.vsix
          if-no-files-found: error
          retention-days: 14
