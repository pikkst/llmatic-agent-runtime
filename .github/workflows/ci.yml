name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Show canonical M10 formatting
        run: pnpm exec prettier apps/cli/tsconfig.json apps/mcp-server/tsconfig.json packages/runtime-tools/src/runtime.ts packages/runtime-tools/test/runtime.test.ts

      - name: Validate
        run: pnpm run ci
