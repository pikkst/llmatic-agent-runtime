name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Canonical format M20 files
        run: |
          pnpm exec prettier --write \
            apps/cli/src/index.ts \
            apps/cli/tsconfig.json \
            apps/mcp-server/src/server.ts \
            apps/mcp-server/tsconfig.json \
            packages/github-task-source/src/index.ts \
            packages/github-task-source/tsconfig.json \
            packages/markdown-task-source/src/index.ts \
            packages/markdown-task-source/test/markdown.test.ts \
            packages/markdown-task-source/tsconfig.json \
            packages/task-provider/src/index.ts \
            packages/task-provider/test/workflow.test.ts \
            packages/task-provider/tsconfig.json \
            packages/task-router/src/index.ts \
            packages/task-router/test/router.test.ts \
            packages/task-router/tsconfig.json \
            README.md

      - name: Upload canonical M20 files
        uses: actions/upload-artifact@v4
        with:
          name: m20-canonical-format
          path: |
            apps/cli/src/index.ts
            apps/cli/tsconfig.json
            apps/mcp-server/src/server.ts
            apps/mcp-server/tsconfig.json
            packages/github-task-source/src/index.ts
            packages/github-task-source/tsconfig.json
            packages/markdown-task-source/src/index.ts
            packages/markdown-task-source/test/markdown.test.ts
            packages/markdown-task-source/tsconfig.json
            packages/task-provider/src/index.ts
            packages/task-provider/test/workflow.test.ts
            packages/task-provider/tsconfig.json
            packages/task-router/src/index.ts
            packages/task-router/test/router.test.ts
            packages/task-router/tsconfig.json
            README.md
          if-no-files-found: error
          retention-days: 1

      - name: Commit canonical M20 formatting
        shell: bash
        run: |
          if git diff --quiet -- \
            apps/cli/src/index.ts \
            apps/cli/tsconfig.json \
            apps/mcp-server/src/server.ts \
            apps/mcp-server/tsconfig.json \
            packages/github-task-source/src/index.ts \
            packages/github-task-source/tsconfig.json \
            packages/markdown-task-source/src/index.ts \
            packages/markdown-task-source/test/markdown.test.ts \
            packages/markdown-task-source/tsconfig.json \
            packages/task-provider/src/index.ts \
            packages/task-provider/test/workflow.test.ts \
            packages/task-provider/tsconfig.json \
            packages/task-router/src/index.ts \
            packages/task-router/test/router.test.ts \
            packages/task-router/tsconfig.json \
            README.md
          then
            echo "No canonical formatting changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/cli/src/index.ts \
            apps/cli/tsconfig.json \
            apps/mcp-server/src/server.ts \
            apps/mcp-server/tsconfig.json \
            packages/github-task-source/src/index.ts \
            packages/github-task-source/tsconfig.json \
            packages/markdown-task-source/src/index.ts \
            packages/markdown-task-source/test/markdown.test.ts \
            packages/markdown-task-source/tsconfig.json \
            packages/task-provider/src/index.ts \
            packages/task-provider/test/workflow.test.ts \
            packages/task-provider/tsconfig.json \
            packages/task-router/src/index.ts \
            packages/task-router/test/router.test.ts \
            packages/task-router/tsconfig.json \
            README.md
          git commit -m "style: apply canonical M20 formatting"
          git push origin HEAD:"${{ github.head_ref || github.ref_name }}"

      - name: Validate
        run: pnpm run ci

      - name: Release acceptance
        shell: bash
        run: |
          VERSION="$(node -e "const fs=require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('package.json','utf8')).version)")"
          node scripts/release-acceptance.mjs "v$VERSION" "$GITHUB_SHA"

      - name: Upload accepted VSIX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llmatic-agent-runtime-vsix
          path: |
            artifacts/llmatic-agent-runtime.vsix
            artifacts/llmatic-agent-runtime-*.vsix
            artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 14
