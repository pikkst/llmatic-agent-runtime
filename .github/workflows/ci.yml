name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Canonical format task connection regression
        run: pnpm exec prettier --write scripts/release-acceptance.mjs packages/agent-orchestrator/test/orchestrator.test.ts

      - name: Commit canonical task connection regression
        shell: bash
        run: |
          if git diff --quiet -- scripts/release-acceptance.mjs packages/agent-orchestrator/test/orchestrator.test.ts
          then
            echo "No canonical formatting changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release-acceptance.mjs packages/agent-orchestrator/test/orchestrator.test.ts
          git commit -m "style: format task connection regression"
          git push origin HEAD:"${{ github.head_ref || github.ref_name }}"

      - name: Validate
        run: pnpm run ci

      - name: Release acceptance
        shell: bash
        run: |
          VERSION="$(node -e "const fs=require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('package.json','utf8')).version)")"
          node scripts/release-acceptance.mjs "v$VERSION" "$GITHUB_SHA"

      - name: Upload accepted VSIX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llmatic-agent-runtime-vsix
          path: |
            artifacts/llmatic-agent-runtime.vsix
            artifacts/llmatic-agent-runtime-*.vsix
            artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  vscode_clean_install:
    name: VS Code clean-install acceptance
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Download accepted VSIX
        uses: actions/download-artifact@v4
        with:
          name: llmatic-agent-runtime-vsix
          path: artifacts

      - name: Run installed-extension acceptance
        timeout-minutes: 10
        run: xvfb-run -a pnpm run vscode:acceptance
