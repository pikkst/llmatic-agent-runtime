name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Show canonical M7 formatting
        run: pnpm exec prettier apps/cli/src/index.ts apps/cli/tsconfig.json packages/github-adapter/src/github.ts packages/github-adapter/test/github.test.ts

      - name: Validate
        run: pnpm run ci
