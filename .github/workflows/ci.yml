name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Show canonical M19 formatting
        run: |
          echo "__BEGIN_README__"
          pnpm exec prettier README.md
          echo "__END_README__"
          echo "__BEGIN_RELEASE_ACCEPTANCE__"
          pnpm exec prettier scripts/release-acceptance.mjs
          echo "__END_RELEASE_ACCEPTANCE__"

      - name: Validate
        run: pnpm run ci

      - name: Upload VSIX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llmatic-agent-runtime-vsix
          path: artifacts/llmatic-agent-runtime.vsix
          if-no-files-found: error
          retention-days: 14
