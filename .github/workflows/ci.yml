name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Canonical format M21 files
        run: |
          pnpm exec prettier --write \
            apps/vscode-extension/src/extension.ts \
            apps/vscode-extension/tsconfig.json \
            packages/discovery-engine/src/index.ts \
            packages/discovery-engine/test/discovery.test.ts \
            README.md

      - name: Commit canonical M21 formatting
        shell: bash
        run: |
          if git diff --quiet -- \
            apps/vscode-extension/src/extension.ts \
            apps/vscode-extension/tsconfig.json \
            packages/discovery-engine/src/index.ts \
            packages/discovery-engine/test/discovery.test.ts \
            README.md
          then
            echo "No canonical formatting changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/vscode-extension/src/extension.ts \
            apps/vscode-extension/tsconfig.json \
            packages/discovery-engine/src/index.ts \
            packages/discovery-engine/test/discovery.test.ts \
            README.md
          git commit -m "style: apply canonical M21 formatting"
          git push origin HEAD:"${{ github.head_ref || github.ref_name }}"

      - name: Validate
        run: pnpm run ci

      - name: Release acceptance
        shell: bash
        run: |
          VERSION="$(node -e "const fs=require('fs'); process.stdout.write(JSON.parse(fs.readFileSync('package.json','utf8')).version)")"
          node scripts/release-acceptance.mjs "v$VERSION" "$GITHUB_SHA"

      - name: Upload accepted VSIX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: llmatic-agent-runtime-vsix
          path: |
            artifacts/llmatic-agent-runtime.vsix
            artifacts/llmatic-agent-runtime-*.vsix
            artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 14
