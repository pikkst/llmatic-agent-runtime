name: Marketplace Entra Identity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  resolve_identity:
    name: Resolve Marketplace identity
    runs-on: ubuntu-latest
    environment: marketplace-production
    env:
      AZURE_TENANT_ID: ${{ secrets.VSCODE_MARKETPLACE_AZURE_TENANT_ID }}
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Login to Microsoft Entra ID
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.VSCODE_MARKETPLACE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.VSCODE_MARKETPLACE_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve Visual Studio Marketplace identity resource ID
        id: marketplace_identity
        shell: bash
        run: |
          PROFILE_ID="$(az rest             -u "https://app.vssps.visualstudio.com/_apis/profile/profiles/me"             --resource "499b84ac-1321-427f-aa17-267ca6975798"             --query id             -o tsv)"

          if [ -z "$PROFILE_ID" ] || [ "$PROFILE_ID" = "null" ]; then
            echo "Could not resolve the Marketplace identity resource ID." >&2
            exit 1
          fi

          echo "Marketplace identity resource ID: $PROFILE_ID"
          {
            echo "### Visual Studio Marketplace identity"
            echo ""
            echo "Add this identity to publisher `eventnexus` as a **Contributor**:"
            echo ""
            echo "`$PROFILE_ID`"
          } >> "$GITHUB_STEP_SUMMARY"
