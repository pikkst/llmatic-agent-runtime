name: Temporary format latest review fix

on:
  push:
    paths:
      - ".github/workflows/format-latest-review-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --write packages/review-engine/src/review.ts packages/review-engine/src/review-contract.ts apps/vscode-extension/test/extension-surface.test.ts
      - shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format review smoke fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
