name: Temporary R1 smoke-fix formatter

on:
  push:
    paths:
      - ".github/workflows/format-r1-smoke-fix.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - name: Format changed text files
        shell: bash
        run: |
          git fetch origin main
          files="$(
            git diff --name-only --diff-filter=ACMRT origin/main...HEAD |
              grep -E '\.(ts|tsx|js|mjs|cjs|json|md|ya?ml)$' |
              grep -v '^\.github/workflows/format-r1-smoke-fix\.yml$' || true
          )"
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs pnpm exec prettier --write
          fi
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format R1 smoke fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
