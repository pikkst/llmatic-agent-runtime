name: Release Acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Candidate semantic tag (for example v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build release contract packages
        run: pnpm exec tsc -b packages/release-metadata packages/update-installer

      - name: Validate and package candidate
        run: pnpm run ci

      - name: Run release acceptance
        run: node scripts/release-acceptance.mjs "${{ inputs.tag }}" "$GITHUB_SHA"

      - name: Upload accepted candidate
        uses: actions/upload-artifact@v4
        with:
          name: llmatic-release-acceptance-${{ inputs.tag }}
          path: |
            artifacts/llmatic-agent-runtime.vsix
            artifacts/llmatic-agent-runtime-*.vsix
            artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 14
